name: Chef backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: chef_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d chef_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p chef-engine --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/chef_test
      - run: cargo run --locked -p brioche-course-contract --example export
      - run: git diff --exit-code -- packages/contracts/src/generated
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - run: npm install -g pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:web
      - run: pnpm test:ssr
      - run: pnpm exec agent-browser install --with-deps
      - run: pnpm test:browser
      - run: pnpm test:browser:ssr
